openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: NovaMail email platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: emails
    description: Email operations
  - name: folders
    description: Folder management
  - name: users
    description: User profile
  - name: admin
    description: Admin operations
  - name: enterprise
    description: Organization security foundation operations
  - name: security
    description: Explainable email security operations
  - name: global-completion
    description: Local-only quarantine, enterprise policy, learning, campaign, and privacy operations
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      responses:
        "200":
          description: PostgreSQL is reachable
        "503":
          description: PostgreSQL is unavailable

  /health/worker/ready:
    get:
      operationId: workerHealthReady
      tags: [health]
      summary: Worker dependency readiness probe
      description: Checks PostgreSQL and Redis reachability required by the dedicated Worker process; it does not assert that a Worker process is alive and exposes no connection details.
      responses:
        "200":
          description: Worker dependencies are ready
        "503":
          description: PostgreSQL or Redis is unavailable
  /metrics:
    get:
      operationId: adminQueueMetrics
      tags: [health]
      summary: Queue metrics for administrators
      description: Returns Admin-only Prometheus metrics for queue lag seconds, stale processing leases, dead-letter jobs, delivery-unknown jobs, retries, duration, and Redis status without job payloads, message content, tokens, or connection strings.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (revoke refresh token)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204":
          description: Logged out

  /realtime/ticket:
    post:
      operationId: issueRealtimeTicket
      tags: [auth]
      summary: Issue a one-time short-lived SSE ticket
      description: Bearer-authenticated endpoint for browser SSE clients. The returned ticket is single-use and expires quickly; access tokens must never be placed in the SSE URL.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresInMs]
                properties:
                  ticket: { type: string }
                  expiresInMs: { type: integer, minimum: 1000 }
        "401":
          description: Authentication required
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      description: Always returns the same response for syntactically valid email addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: Request or resend email verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      summary: Confirm email using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions:
    get:
      operationId: listAuthSessions
      tags: [auth]
      summary: List active sessions for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      tags: [auth]
      summary: Revoke one active session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "400":
          description: Invalid session id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllAuthSessions
      tags: [auth]
      summary: Revoke all sessions, optionally keeping the current session
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllSessionsInput"
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllSessionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── USERS ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/password:
    patch:
      operationId: changePassword
      tags: [users]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── EMAILS ──────────────────────────────────────────────────────────────────
  /emails:
    get:
      operationId: listEmails
      tags: [emails]
      summary: List emails
      security:
        - bearerAuth: []
      parameters:
        - name: folder
          in: query
          schema:
            type: string
            enum: [inbox, sent, drafts, starred, archive, trash, spam, snoozed]
          description: Filter by system folder
        - name: accountId
          in: query
          schema:
            type: [string, "null"]
          description: Owned Gmail connection id; omit for all accounts/local data
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal mailbox listing returns 409 NOT_CONFIGURED until emails have an organization mapping; personal scope is the default.
        - name: folderId
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by custom folder id
        - name: search
          in: query
          schema:
            type: ["string", "null"]
            maxLength: 200
          description: PostgreSQL simple-config full-text search across subject, sender, recipients, and body text
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
            maxLength: 256
          description: Opaque cursor returned as nextCursor for stable createdAt/id pagination
        - name: unreadOnly
          in: query
          schema:
            type: boolean
          description: Only return unread emails
        - name: dateFrom
          in: query
          schema:
            type: [string, "null"]
            format: date-time
          description: Include messages created on or after this timestamp
        - name: dateTo
          in: query
          schema:
            type: [string, "null"]
            format: date-time
          description: Include messages created on or before this timestamp
        - name: hasAttachments
          in: query
          schema:
            type: boolean
          description: Filter messages by attachment presence
        - name: label
          in: query
          schema:
            type: [string, "null"]
          description: Filter by a JSON label
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_send, scheduled, sending, sent, cancelled, failed]
          description: Filter by delivery status
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/EmailCategory"
          description: Filter by canonical inbox category
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailListResponse"
        "409":
          description: Organization-scoped mailbox listing is not configured because email rows have no organization mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: sendEmail
      tags: [emails]
      summary: Send or save a draft email
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Reusing the same key safely returns the original send result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "201":
          description: Email sent or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  /emails/categories/summary:
    get:
      operationId: getEmailCategorySummary
      tags: [emails]
      summary: Get category counts for the authenticated mailbox
      security:
        - bearerAuth: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal counts return scopeIsolation=NOT_CONFIGURED until emails have an organization mapping.
      responses:
        "200":
          description: Category counts and local classifier state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCategorySummary"
        "401":
          description: Authentication required

  /emails/bulk/by-sender:
    post:
      operationId: bulkSenderAction
      tags: [emails]
      summary: Preview or execute a confirmed reversible bulk sender action
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal bulk sender actions return 409 until emails have an organization mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender, action]
              properties:
                sender: { type: string, format: email }
                action: { type: string, enum: [trash, archive, read, move] }
                destination: { type: string, enum: [inbox, archive, spam] }
                confirm: { type: boolean, default: false }
      responses:
        "200": { description: Confirmation preview or completed action }
        "400": { description: Invalid sender or action }
        "401": { description: Authentication required }
        "409": { description: Organization-scoped bulk sender action is not configured }
        "429": { description: Rate limit exceeded }
  /emails/attachments/quota:
    get:
      operationId: getAttachmentStorageQuota
      tags: [emails]
      summary: Get local attachment storage usage and quota state
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Access is checked before returning organization usage.
      responses:
        "200":
          description: Storage usage; quota is NOT_CONFIGURED when no deployment limit is supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentStorageQuota" }
        "401": { description: Authentication required }
        "403": { description: Organization access denied }
  /emails/catch-up:
    get:
      operationId: getCatchUpInbox
      tags: [emails]
      summary: Get unread inbox messages for reversible catch-up review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal catch-up returns 409 NOT_CONFIGURED until emails have an organization mapping.
      responses:
        "200":
          description: Unread inbox page
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [state, providerState, undoRequiredForPermanentDelete]
                    properties:
                      state: { type: string, enum: [READY] }
                      providerState: { type: string, enum: [NOT_CONFIGURED] }
                      undoRequiredForPermanentDelete: { type: boolean }
                  - $ref: "#/components/schemas/EmailListResponse"
        "401": { description: Authentication required }
        "409": { description: Organization-scoped mailbox listing is not configured }

  /emails/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [emails]
      summary: Detect unsubscribe links from owned email content without opening them
      security: [{ bearerAuth: [] }]
      parameters:
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal mailbox reads return 409 until emails have an organization mapping.
      responses:
        "200":
          description: Subscription links and external provider state
          content:
            application/json:
              schema:
                type: object
                required: [state, providerState, subscriptions, actions]
                properties:
                  state: { type: string, enum: [MANUAL_LINKS_FOUND, NOT_CONFIGURED] }
                  providerState: { type: string, enum: [NOT_CONFIGURED] }
                  subscriptions: { type: array, items: { $ref: "#/components/schemas/UnsubscribeResult" } }
                  actions: { type: object, additionalProperties: { type: string } }
        "401": { description: Authentication required }
        "409": { description: Organization-scoped mailbox listing is not configured }

  /emails/orders:
    get:
      operationId: listOrders
      tags: [emails]
      summary: List order facts extracted from owned emails; carrier tracking is not queried
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: folder, in: query, required: false, schema: { type: string, enum: [archive] } }
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal mailbox reads return 409 until emails have an organization mapping.
      responses:
        "200":
          description: Locally extracted order facts
          content:
            application/json:
              schema:
                type: object
                required: [state, providerState, trackingState, orders]
                properties:
                  state: { type: string, enum: [READY] }
                  providerState: { type: string, enum: [NOT_CONFIGURED] }
                  trackingState: { type: string, enum: [NOT_CONFIGURED] }
                  orders: { type: array, items: { $ref: "#/components/schemas/OrderRecord" } }
        "401": { description: Authentication required }
        "409": { description: Organization-scoped mailbox listing is not configured }

  /emails/finance:
    get:
      operationId: listFinanceRecords
      tags: [emails]
      summary: List receipt, invoice and bill facts extracted from owned emails
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: folder, in: query, required: false, schema: { type: string, enum: [archive] } }
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal mailbox reads return 409 until emails have an organization mapping.
      responses:
        "200":
          description: Locally extracted finance records
          content:
            application/json:
              schema:
                type: object
                required: [state, providerState, records]
                properties:
                  state: { type: string, enum: [READY] }
                  providerState: { type: string, enum: [NOT_CONFIGURED] }
                  records: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } }
        "401": { description: Authentication required }

  /emails/{id}/priority:
    get:
      operationId: getEmailPriority
      tags: [emails]
      summary: Get explainable local priority for an email
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal mailbox reads return 409 until emails have an organization mapping.
      responses:
        "200":
          description: Priority result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriorityResult" }
        "401": { description: Authentication required }
        "404": { description: Email not found }
        "409": { description: Organization-scoped mailbox listing is not configured }

  /emails/{id}/actions:
    get:
      operationId: getEmailActions
      tags: [emails]
      summary: Get explainable actions for an email; does not execute actions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Organization scope. Non-personal mailbox reads return 409 until emails have an organization mapping.
      responses:
        "200":
          description: Deterministic action suggestions
          content:
            application/json:
              schema:
                type: object
                required: [state, providerState, actions]
                properties:
                  state: { type: string, enum: [READY] }
                  providerState: { type: string, enum: [NOT_CONFIGURED] }
                  actions: { type: array, items: { $ref: "#/components/schemas/EmailAction" } }
        "401": { description: Authentication required }
        "404": { description: Email not found }
        "409": { description: Organization-scoped mailbox listing is not configured }

  /emails/{id}/category:
    patch:
      operationId: updateEmailCategory
      tags: [emails]
      summary: Correct an email category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-Organization-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
          description: Optional organization scope; membership is checked server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCategoryCorrectionInput"
      responses:
        "200":
          description: Category correction saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCategoryCorrectionResponse"
        "400":
          description: Invalid category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
        "404":
          description: Email not found or organization access denied

  /emails/{id}:
    get:
      operationId: getEmail
      tags: [emails]
      summary: Get a single email by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: trashEmail
      tags: [emails]
      summary: Move email to trash
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Moved to trash

