components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    GlobalCompletionObject:
      type: object
      additionalProperties: true
    GlobalCompletionCollection:
      type: object
      additionalProperties: true
    QuarantineInput:
      type: object
      required: [emailId, reason, riskScore]
      properties:
        emailId: { type: string, format: uuid }
        incidentId: { type: [string, "null"], format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
    EnterprisePolicyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        scope: { type: string, enum: [organization, user, group], default: organization }
        targetUserId: { type: [string, "null"], format: uuid }
        targetGroup: { type: [string, "null"], maxLength: 120 }
        enabled: { type: boolean }
        riskThreshold: { type: integer, minimum: 0, maximum: 100 }
        linkAction: { type: string, enum: [allow, warn, quarantine, block] }
        attachmentAction: { type: string, enum: [allow, warn, quarantine, block] }
        senderAction: { type: string, enum: [allow, warn, quarantine, block] }
        allowlist: { type: array, items: { type: string }, maxItems: 500 }
        blocklist: { type: array, items: { type: string }, maxItems: 500 }
    PolicyEvaluationInput:
      type: object
      required: [emailId, riskScore, signal]
      properties:
        emailId: { type: string, format: uuid }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        signal: { type: string, enum: [link, attachment, sender] }
    SpamLearningInput:
      type: object
      required: [emailId, feedbackType]
      properties:
        emailId: { type: string, format: uuid }
        feedbackType: { type: string, enum: [spam, not_spam] }
    CampaignCorrelationInput:
      type: object
      required: [emailId, riskScore]
      properties:
        emailId: { type: string, format: uuid }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        signals: { type: array, items: { type: string, maxLength: 160 }, maxItems: 20 }
    PrivacyRequestInput:
      type: object
      required: [requestType]
      properties:
        requestType: { type: string, enum: [export, delete] }
        reason: { type: string, maxLength: 500 }
    ConsentInput:
      type: object
      required: [consentType, granted]
      properties:
        consentType: { type: string, minLength: 2, maxLength: 80 }
        granted: { type: boolean }
        scope: { type: string, default: organization, maxLength: 40 }
    EnterpriseOrganization:
      type: object
      required: [id, name, slug, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, security_analyst, auditor, member] }
        createdAt: { type: string, format: date-time }
    CreateOrganizationInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 2, maxLength: 160 } }
    OrganizationMemberInput:
      type: object
      required: [email, role]
      properties:
