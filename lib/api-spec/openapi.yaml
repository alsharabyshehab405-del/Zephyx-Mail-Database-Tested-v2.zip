openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: NovaMail email platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: emails
    description: Email operations
  - name: folders
    description: Folder management
  - name: users
    description: User profile
  - name: admin
    description: Admin operations
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/live:
    get:
      operationId: healthLive
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      tags: [health]
      summary: Readiness probe
      responses:
        "200":
          description: PostgreSQL is reachable
        "503":
          description: PostgreSQL is unavailable

  /health/worker/ready:
    get:
      operationId: workerHealthReady
      tags: [health]
      summary: Worker dependency readiness probe
      description: Checks PostgreSQL and Redis reachability required by the dedicated Worker process; it does not assert that a Worker process is alive and exposes no connection details.
      responses:
        "200":
          description: Worker dependencies are ready
        "503":
          description: PostgreSQL or Redis is unavailable
  /metrics:
    get:
      operationId: adminQueueMetrics
      tags: [health]
      summary: Queue metrics for administrators
      description: Returns Admin-only Prometheus metrics for queue lag seconds, stale processing leases, dead-letter jobs, delivery-unknown jobs, retries, duration, and Redis status without job payloads, message content, tokens, or connection strings.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (revoke refresh token)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "204":
          description: Logged out

  /realtime/ticket:
    post:
      operationId: issueRealtimeTicket
      tags: [auth]
      summary: Issue a one-time short-lived SSE ticket
      description: Bearer-authenticated endpoint for browser SSE clients. The returned ticket is single-use and expires quickly; access tokens must never be placed in the SSE URL.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresInMs]
                properties:
                  ticket: { type: string }
                  expiresInMs: { type: integer, minimum: 1000 }
        "401":
          description: Authentication required
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      description: Always returns the same response for syntactically valid email addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      tags: [auth]
      summary: Request or resend email verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [auth]
      summary: Confirm email using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions:
    get:
      operationId: listAuthSessions
      tags: [auth]
      summary: List active sessions for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeAuthSession
      tags: [auth]
      summary: Revoke one active session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "400":
          description: Invalid session id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllAuthSessions
      tags: [auth]
      summary: Revoke all sessions, optionally keeping the current session
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllSessionsInput"
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllSessionsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── USERS ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/password:
    patch:
      operationId: changePassword
      tags: [users]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── EMAILS ──────────────────────────────────────────────────────────────────
  /emails:
    get:
      operationId: listEmails
      tags: [emails]
      summary: List emails
      security:
        - bearerAuth: []
      parameters:
        - name: folder
          in: query
          schema:
            type: string
            enum: [inbox, sent, drafts, starred, archive, trash, spam, snoozed]
          description: Filter by system folder
        - name: accountId
          in: query
          schema:
            type: [string, "null"]
          description: Owned Gmail connection id; omit for all accounts/local data
        - name: folderId
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by custom folder id
        - name: search
          in: query
          schema:
            type: ["string", "null"]
            maxLength: 200
          description: PostgreSQL simple-config full-text search across subject, sender, recipients, and body text
        - name: cursor
          in: query
          schema:
            type: ["string", "null"]
            maxLength: 256
          description: Opaque cursor returned as nextCursor for stable createdAt/id pagination
        - name: unreadOnly
          in: query
          schema:
            type: boolean
          description: Only return unread emails
        - name: dateFrom
          in: query
          schema:
            type: [string, "null"]
            format: date-time
          description: Include messages created on or after this timestamp
        - name: dateTo
          in: query
          schema:
            type: [string, "null"]
            format: date-time
          description: Include messages created on or before this timestamp
        - name: hasAttachments
          in: query
          schema:
            type: boolean
          description: Filter messages by attachment presence
        - name: label
          in: query
          schema:
            type: [string, "null"]
          description: Filter by a JSON label
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_send, scheduled, sending, sent, cancelled, failed]
          description: Filter by delivery status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailListResponse"

    post:
      operationId: sendEmail
      tags: [emails]
      summary: Send or save a draft email
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Reusing the same key safely returns the original send result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "201":
          description: Email sent or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  /emails/{id}:
    get:
      operationId: getEmail
      tags: [emails]
      summary: Get a single email by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: trashEmail
      tags: [emails]
      summary: Move email to trash
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Moved to trash

  /emails/{id}/draft:
    patch:
      operationId: updateDraft
      tags: [emails]
      summary: Update or send an existing draft email
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdateInput"
      responses:
        "200":
          description: Draft updated or sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "400":
          description: Invalid draft operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /emails/{id}/cancel:
    post:
      operationId: cancelEmailSend
      tags: [emails]
      summary: Cancel an undo-send or scheduled email
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "409":
          description: The email has already been sent or cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /emails/{id}/permanent:
    delete:
      operationId: deleteEmailPermanent
      tags: [emails]
      summary: Permanently delete an email
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Permanently deleted

  /emails/{id}/read:
    patch:
      operationId: markEmailRead
      tags: [emails]
      summary: Mark email as read or unread
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Updated email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  /emails/{id}/star:
    patch:
      operationId: toggleEmailStar
      tags: [emails]
      summary: Toggle starred status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  /emails/{id}/move:
    patch:
      operationId: moveEmail
      tags: [emails]
      summary: Move email to a folder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveEmailInput"
      responses:
        "200":
          description: Updated email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  # ─── FOLDERS ─────────────────────────────────────────────────────────────────
  /folders:
    get:
      operationId: listFolders
      tags: [folders]
      summary: List custom folders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Folder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"

    post:
      operationId: createFolder
      tags: [folders]
      summary: Create a custom folder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"

  /folders/{id}:
    patch:
      operationId: updateFolder
      tags: [folders]
      summary: Update a custom folder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"

    delete:
      operationId: deleteFolder
      tags: [folders]
      summary: Delete a custom folder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── STATS ───────────────────────────────────────────────────────────────────
  /stats/inbox:
    get:
      operationId: getInboxStats
      tags: [stats]
      summary: Get inbox statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inbox stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxStats"

  # ─── ADMIN ───────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get a user by id (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user status or role (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Platform-wide statistics (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

# ─── COMPONENTS ────────────────────────────────────────────────────────────────
  /ai/write:
    post:
      operationId: aiWrite
      tags: [ai]
      summary: Generate or transform email content
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: { type: string, enum: [draft, rephrase, shorten, quick_reply] }
                instruction: { type: string }
                context: { type: string }
                threadText: { type: string }
      responses:
        "200": { description: Generated email content }
  /ai/summary/{emailId}:
    post:
      operationId: summarizeEmail
      tags: [ai]
      summary: Summarize an email thread
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: emailId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Thread summary }
  /ai/categorize/{emailId}:
    post:
      operationId: categorizeEmail
      tags: [ai]
      summary: Categorize an email
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: emailId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Category result }
  /emails/{id}/snooze:
    patch:
      operationId: snoozeEmail
      tags: [emails]
      summary: Snooze an email
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time }
      responses:
        "200": { description: Snoozed email }
    delete:
      operationId: unsnoozeEmail
      tags: [emails]
      summary: Unsnooze an email
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Unsnoozed email }
  /productivity/templates:
