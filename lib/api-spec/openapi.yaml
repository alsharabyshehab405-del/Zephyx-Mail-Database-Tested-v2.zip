  /ai/write:
    post:
      operationId: aiWrite
      tags: [ai]
      summary: Generate or transform email content as a draft suggestion; never sends automatically
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: { type: string, enum: [draft, rephrase, shorten, expand, professional, friendly, formal, casual, polite, direct, grammar, translate, subject, quick_reply] }
                instruction: { type: string }
                context: { type: string }
                threadText: { type: string }
                consentGranted: { type: boolean, default: false, description: Explicit user consent required before a configured provider receives redacted text. }
      responses:
        "200":
          description: Generated email content or explicit provider state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiWriteResult" }
        "400": { description: Invalid operation or missing input }
        "428": { description: Explicit AI consent is required when a provider is configured }
  /ai/summary/{emailId}:
    post:
      operationId: summarizeEmail
      tags: [ai]
      summary: Summarize an email thread
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: emailId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [short, detailed, key_points, action_items], default: short }
                persist: { type: boolean, default: false, description: Persist only the generated short/detailed summary after explicit user action. }
                consentGranted: { type: boolean, default: false, description: Explicit user consent required before a configured provider receives redacted text. }
      responses:
        "200":
          description: Structured thread summary or explicit provider state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmartSummary" }
        "404": { description: Email not found }
        "428": { description: Explicit AI consent is required when a provider is configured }
