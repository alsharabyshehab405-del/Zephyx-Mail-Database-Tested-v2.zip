        icon:
          type: ["string", "null"]
        emailCount:
          type: integer
        userId:
          type: string
        createdAt:
          type: string
          format: date-time

    FolderInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
        icon:
