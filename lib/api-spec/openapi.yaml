components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProductivityAccounts:
      type: object
      required: [activeAccountId, accounts, providerAvailability]
      properties:
        activeAccountId: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/ProductivityAccount" }
        providerAvailability:
          type: object
          required: [gmail, outlook, smtp]
          properties:
            gmail: { type: boolean }
            outlook: { type: boolean }
            smtp: { type: boolean }
    ProductivityAccount:
      type: object
      required: [id, provider, externalAccountId, emailAddress, syncStatus]
      properties:
        id: { type: string }
        provider: { type: string, enum: [local, gmail, outlook, smtp] }
        externalAccountId: { type: string }
        emailAddress: { type: string }
        displayName: { type: [string, "null"] }
        syncStatus: { type: string, enum: [connected, syncing, error, revoked, not_configured] }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: [string, "null"], format: date-time }
    ActiveAccount:
      type: object
      required: [activeAccountId]
      properties:
        activeAccountId: { type: string }
    ActiveAccountInput:
      type: object
      required: [accountId]
      properties:
        accountId: { type: [string, "null"] }
    FocusMode:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [focus, work, follow_up] }
    FocusModeInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [focus, work, follow_up] }
    PrivacyCenter:
      type: object
      required: [controls, encryption, sessions, accessLog, providers]
      properties:
        controls:
          $ref: "#/components/schemas/PrivacyControls"
        encryption:
          type: object
          required: [status, label]
          properties:
            status: { type: string, enum: [not_configured, transport_only] }
            label: { type: string }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PrivacySession" }
        accessLog:
          type: array
          items: { $ref: "#/components/schemas/PrivacyAccessLogEntry" }
        providers:
          type: object
          required: [ai, gmail, outlook, smtp, fcm, webPush, clamav, billing]
          properties:
            ai: { type: string, enum: [connected, not_configured] }
            gmail: { type: string, enum: [connected, not_configured] }
            outlook: { type: string, enum: [connected, not_configured] }
            smtp: { type: string, enum: [connected, not_configured] }
            fcm: { type: string, enum: [connected, not_configured] }
            webPush: { type: string, enum: [connected, not_configured] }
            clamav: { type: string, enum: [connected, not_configured] }
            billing: { type: string, enum: [connected, not_configured] }
    PrivacyControls:
      type: object
      required: [externalImagesBlocked, trackingPixelsBlocked]
      properties:
        externalImagesBlocked: { type: boolean }
        trackingPixelsBlocked: { type: boolean }
    PrivacyCenterInput:
      type: object
      properties:
        externalImagesBlocked: { type: boolean }
        trackingPixelsBlocked: { type: boolean }
    PrivacySession:
      type: object
      required: [id, createdAt, current]
      properties:
        id: { type: string }
        deviceName: { type: [string, "null"] }
        userAgent: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        current: { type: boolean }
    PrivacyAccessLogEntry:
      type: object
      required: [id, action, success, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        targetType: { type: [string, "null"] }
        success: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductivityQueryPlan:
      type: object
      required: [raw, terms, filters]
      properties:
        raw: { type: string }
        terms: { type: string }
        filters:
          type: array
          items: { type: string }
    ProductivityEmail:
      type: object
      required: [id, subject, fromEmail, isRead, isStarred, category, bodyText, createdAt]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        fromEmail: { type: string, format: email }
        isRead: { type: boolean }
        isStarred: { type: boolean }
        category: { type: string }
        bodyText: { type: string }
        labels:
          type: [array, "null"]
          items: { type: string }
        createdAt: { type: string, format: date-time }
    SmartInboxItem:
      type: object
      required: [email, score, reasons]
      properties:
        email: { $ref: "#/components/schemas/ProductivityEmail" }
        score: { type: integer, minimum: 0 }
        reasons:
          type: array
          items: { type: string }
    WorkspaceTask:
      type: object
      required: [id, title, status, priority, dueAt, version]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        title: { type: string }
        status: { type: string, enum: [open, completed] }
        priority: { type: string, enum: [low, normal, high] }
        version: { type: integer, minimum: 1 }
        dueAt: { type: [string, "null"], format: date-time }
        emailId: { type: [string, "null"], format: uuid }
    WorkspaceEvent:
      type: object
      required: [id, title, startsAt, endsAt, location]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        location: { type: [string, "null"] }
        emailId: { type: [string, "null"], format: uuid }
    WorkspaceFollowUp:
      type: object
      required: [id, emailId, remindAt, status, note, waitingForReply, version, emailSubject, fromEmail]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        emailId: { type: string, format: uuid }
        remindAt: { type: string, format: date-time }
        status: { type: string, enum: [open, snoozed, completed, dismissed] }
        note: { type: string }
        waitingForReply: { type: boolean }
        version: { type: integer, minimum: 1 }
        emailSubject: { type: string }
        fromEmail: { type: string, format: email }
    ProductivityWorkspace:
      type: object
      required: [smartInbox, overdueTasks, upcomingEvents, drafts, followUps, generatedAt, accountId, focusMode, savedSearches, quickActions]
      properties:
        smartInbox:
          type: object
          required: [queryPlan, emails]
          properties:
            queryPlan: { $ref: "#/components/schemas/ProductivityQueryPlan" }
            emails:
              type: array
              items: { $ref: "#/components/schemas/SmartInboxItem" }
        overdueTasks:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceTask" }
        upcomingEvents:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceEvent" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/ProductivityEmail" }
        followUps:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceFollowUp" }
        generatedAt: { type: string, format: date-time }
        accountId: { type: string }
        focusMode: { type: string, enum: [focus, work, follow_up] }
        savedSearches: { type: array, items: { type: string } }
        quickActions: { type: array, items: { type: string } }
    WorkspacePreferences:
      type: object
      required: [userId, activeAccountId, focusMode, privacyExternalImagesBlocked, privacyTrackingPixelsBlocked, inboxDensity, inboxLayout, visibleSections, visibleColumns, accentColor, theme, keyboardShortcuts, savedSearches]
      properties:
        userId: { type: string, format: uuid }
        activeAccountId: { type: [string, "null"] }
        focusMode: { type: string, enum: [focus, work, follow_up] }
        privacyExternalImagesBlocked: { type: boolean }
        privacyTrackingPixelsBlocked: { type: boolean }
        inboxDensity: { type: string, enum: [comfortable, compact] }
        inboxLayout: { type: string, enum: [two-pane, list, split] }
        visibleSections: { type: array, items: { type: string } }
        visibleColumns: { type: array, items: { type: string } }
        accentColor: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        keyboardShortcuts: { type: object, additionalProperties: { type: string } }
        savedSearches: { type: array, items: { type: string } }
    WorkspacePreferencesInput:
      type: object
      properties:
        activeAccountId: { type: [string, "null"] }
        focusMode: { type: string, enum: [focus, work, follow_up] }
        privacyExternalImagesBlocked: { type: boolean }
        privacyTrackingPixelsBlocked: { type: boolean }
        inboxDensity: { type: string, enum: [comfortable, compact] }
        inboxLayout: { type: string, enum: [two-pane, list, split] }
        visibleSections: { type: array, items: { type: string } }
        visibleColumns: { type: array, items: { type: string } }
        accentColor: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        keyboardShortcuts: { type: object, additionalProperties: { type: string } }
        savedSearches: { type: array, items: { type: string } }
    FollowUpInput:
      type: object
      required: [emailId, remindAt]
      properties:
        emailId: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        remindAt: { type: string, format: date-time }
        note: { type: string, maxLength: 2000 }
        waitingForReply: { type: boolean, default: true }
    FollowUpUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, snoozed, completed, dismissed] }
        remindAt: { type: string, format: date-time }
        note: { type: string, maxLength: 2000 }
        waitingForReply: { type: boolean }
        expectedVersion: { type: integer, minimum: 1 }
    AiProductivityInsight:
      type: object
      required: [summary, suggestedReply, tasks, events, priority, needsFollowUp, confidence]
      properties:
        summary: { type: string }
        suggestedReply: { type: string }
        tasks: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        priority: { type: string, enum: [low, normal, high] }
        needsFollowUp: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1 }
    MailProviderAccount:
      type: object
      required: [id, provider, externalAccountId, emailAddress, syncStatus]
      properties:
        id: { type: string }
        provider: { type: string, enum: [gmail, outlook] }
        externalAccountId: { type: string }
        emailAddress: { type: string, format: email }
        displayName: { type: [string, "null"] }
        scopes: { type: [string, "null"] }
        syncStatus: { type: string, enum: [connected, revoked, not_configured] }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationDevice:
      type: object
      required: [id, platform, isActive, lastSeenAt, createdAt]
      properties:
        id: { type: string }
        platform: { type: string, enum: [web, android, ios] }
        isActive: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RegisterNotificationDevice:
      type: object
      required: [platform, pushToken]
      properties:
        platform: { type: string, enum: [web, android, ios] }
        pushToken: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    NotificationDeliveryRecord:
      type: object
      required: [id, eventType, eventId, status]
      properties:
        id: { type: string }
        deviceId: { type: [string, "null"] }
        eventType: { type: string }
        eventId: { type: string }
        status: { type: string }
        createdAt: { type: [string, "null"], format: date-time }
    NotificationPreferences:
      type: object
      required: [userId, pushEnabled, showPreview]
      properties:
        userId: { type: string }
        pushEnabled: { type: boolean }
        showPreview: { type: boolean }
    NotificationPreferencesInput:
      type: object
      properties:
        pushEnabled: { type: boolean }
        showPreview: { type: boolean }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Auth ──
    RegisterInput:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    AuthSession:
      type: object
      required: [id, createdAt, expiresAt, isCurrent]
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          type: ["string", "null"]
        userAgentShort:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean

    SessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"

    RevokeAllSessionsInput:
      type: object
      properties:
        keepCurrentSession:
          type: boolean
          default: false

    RevokeAllSessionsResponse:
      type: object
      required: [message, revokedCount]
      properties:
        message:
          type: string
        revokedCount:
          type: integer
          minimum: 0

    # ── User ──
    User:
      type: object
      required: [id, email, firstName, lastName, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        locale:
          type: string
          enum: [en, ar, es, fr, de, pt, it, tr, ru, zh-CN, ja, ko, hi, id, ur]
        theme:
          type: string
          enum: [light, dark, system]
        emailVerifiedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        locale:
          type: string
          enum: [en, ar, es, fr, de, pt, it, tr, ru, zh-CN, ja, ko, hi, id, ur]
        theme:
          type: string
          enum: [light, dark, system]

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    # ── Email ──
    EmailAddress:
      type: object
      required: [email]
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]

    EmailAttachment:
      type: object
      required: [filename, url, size, mimeType]
      properties:
        filename:
          type: string
        url:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        scanStatus:
          type: string
          enum: [clean, infected, unavailable, not_scanned]
          description: Server-side malware scan verdict

    Email:
      type: object
      required: [id, subject, from, to, bodyHtml, bodyText, folder, isRead, isStarred, isDraft, createdAt]
      properties:
        id:
          type: string
        subject:
          type: string
        from:
          $ref: "#/components/schemas/EmailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bodyHtml:
          type: string
        bodyText:
          type: string
        folder:
          type: string
          enum: [inbox, sent, drafts, starred, archive, trash, spam, snoozed]
        customFolderId:
          type: ["string", "null"]
        isRead:
          type: boolean
        isStarred:
          type: boolean
        isDraft:
          type: boolean
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/EmailAttachment"
        threadId:
          type: ["string", "null"]
        replyToId:
          type: ["string", "null"]
        labels:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: ["string", "null"]
          format: date-time
        messageId:
          type: ["string", "null"]
        inReplyTo:
          type: ["string", "null"]
        references:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, pending_send, scheduled, sending, sent, cancelled, failed]
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        sendError:
          type: ["string", "null"]
        category:
          type: string
          enum: [primary, promotional, updates, social]
        aiSummary:
          type: ["string", "null"]
        snoozedUntil:
          type: ["string", "null"]
          format: date-time
        threat:
          allOf:
            - $ref: "#/components/schemas/ThreatAnalysis"
          nullable: true

    EmailInput:
      type: object
      required: [to, subject, bodyHtml]
      properties:
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          minItems: 1
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        bodyHtml:
          type: string
        bodyText:
          type: string
        attachments:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/EmailAttachment"
        isDraft:
          type: boolean
          default: false
        replyToId:
          type: ["string", "null"]
        inReplyTo:
          type: ["string", "null"]
        references:
          type: array
          items:
            type: string
        scheduledAt:
          type: ["string", "null"]
        undoDelaySeconds:
          type: integer
          minimum: 5
          maximum: 30

    DraftUpdateInput:
      type: object
      required: [to, subject, bodyHtml]
      properties:
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        bodyHtml:
          type: string
        bodyText:
          type: string
        attachments:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/EmailAttachment"
        replyToId:
          type: ["string", "null"]
        sendNow:
          type: boolean
          default: false
        inReplyTo:
          type: ["string", "null"]
        references:
          type: array
          items:
            type: string
        scheduledAt:
          type: ["string", "null"]
        undoDelaySeconds:
          type: integer
          minimum: 5
          maximum: 30

    EmailListResponse:
      type: object
      required: [emails, total, page, limit]
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        nextCursor:
          type: ["string", "null"]
          description: Opaque cursor for the next page
        unreadCount:
          type: integer

    MarkReadInput:
      type: object
      required: [isRead]
      properties:
        isRead:
          type: boolean

    MoveEmailInput:
      type: object
      required: [folder]
      properties:
        folder:
          type: string
          enum: [inbox, sent, drafts, starred, archive, trash, spam, snoozed]
        customFolderId:
          type: ["string", "null"]

    ThreatReason:
      type: object
      required: [code, score, label]
      properties:
        code: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        label: { type: string }

    ThreatUrlFinding:
      type: object
      required: [url, host, verdict, reasons]
      properties:
        url: { type: string }
        host: { type: ["string", "null"] }
        verdict:
          type: string
          enum: [safe, suspicious, malicious, unknown]
        reasons:
          type: array
          items: { type: string }

    ThreatAnalysis:
      type: object
      required: [id, emailId, spfResult, dkimResult, dmarcResult, spoofingRisk, spamScore, spamReasons, urlFindings, malwareStatus, overallRisk, analysisVersion, analyzedAt]
      properties:
        id: { type: string }
        emailId: { type: string }
        spfResult: { type: string, enum: [pass, fail, softfail, neutral, none, unknown] }
        dkimResult: { type: string, enum: [pass, fail, softfail, neutral, none, unknown] }
        dmarcResult: { type: string, enum: [pass, fail, softfail, neutral, none, unknown] }
        authenticationSource: { type: ["string", "null"] }
        returnPathDomain: { type: ["string", "null"] }
        fromDomain: { type: ["string", "null"] }
        spoofingRisk: { type: string, enum: [none, low, medium, high] }
        spamScore: { type: integer, minimum: 0, maximum: 100 }
        spamReasons:
          type: array
          items: { $ref: "#/components/schemas/ThreatReason" }
        urlFindings:
          type: array
          items: { $ref: "#/components/schemas/ThreatUrlFinding" }
        malwareStatus: { type: string, enum: [clean, infected, unavailable, not_scanned] }
        overallRisk: { type: string, enum: [none, low, medium, high] }
        analysisVersion: { type: string }
        analyzedAt: { type: string, format: date-time }

    SecurityReportInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [spam, phishing] }
        reason: { type: string, maxLength: 500 }

    SecurityReport:
      type: object
      required: [id, emailId, reportType, reason, createdAt, duplicate]
      properties:
        id: { type: string }
        emailId: { type: string }
        reportType: { type: string, enum: [spam, phishing] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        duplicate: { type: boolean }

    SecurityProviderStatus:
      type: object
      additionalProperties: { type: string }
      description: Local security controls and explicitly configured external providers.

    # ── Folder ──
    Folder:
