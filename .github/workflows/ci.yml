name: Zephyx Mail CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zephyx_test
          POSTGRES_PASSWORD: zephyx_test_password
          POSTGRES_DB: zephyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zephyx_test -d zephyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zephyx_test:zephyx_test_password@127.0.0.1:5432/zephyx_test
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_PREFIX: zephyx-ci
      WORKER_CONCURRENCY: 2
      QUEUE_MAX_ATTEMPTS: 3
      QUEUE_BACKOFF_MS: 100
      JOB_TIMEOUT_MS: 5000
      SCHEDULER_ENABLED: false
      JWT_ACCESS_SECRET: ci-access-secret-long-enough-for-tests-only
      JWT_REFRESH_SECRET: ci-refresh-secret-long-enough-for-tests-only
      SESSION_IP_HASH_SECRET: ci-session-hash-secret-for-tests-only
      TWO_FACTOR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      LOG_LEVEL: silent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate OpenAPI contract
        run: pnpm --dir lib/api-spec run openapi:check
      - name: Validate and generate API clients
        run: |
          pnpm --dir lib/api-spec run codegen
          git diff --exit-code -- lib/api-client-react/src lib/api-zod/src
      - name: Validate all localization namespaces
        run: pnpm --dir artifacts/novamail-web run i18n:check
      - name: Validate and generate Prisma client
        run: |
          pnpm run db:validate
          pnpm run db:generate
      - name: Apply production migrations
        run: pnpm run db:migrate:deploy
      - name: Type-check workspace
        run: pnpm run typecheck
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Run PostgreSQL integration tests
        run: pnpm run test:integration
      - name: Run Worker processor and reliability integration tests
        run: pnpm run test:worker
      - name: Run Redis and Queue integration tests
        run: pnpm run test:queue
      - name: Build production artifacts
        run: pnpm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Web E2E and accessibility tests
        run: pnpm run test:e2e

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: mobile/novamail-flutter
        run: flutter pub get
      - name: Dart format
        working-directory: mobile/novamail-flutter
        run: dart format --output=none --set-exit-if-changed .
      - name: Flutter analyze
        working-directory: mobile/novamail-flutter
        run: flutter analyze
      - name: Flutter unit and widget tests
        working-directory: mobile/novamail-flutter
        run: flutter test --coverage
      - name: Android debug APK
        working-directory: mobile/novamail-flutter
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://127.0.0.1.invalid
