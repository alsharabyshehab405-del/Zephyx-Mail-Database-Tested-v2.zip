name: Zephyx Mail Production v6 Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/production-launch-v6]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:secrets

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high --prod

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:sbom
      - uses: actions/upload-artifact@v4
        with:
          name: zephyx-v6-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --tag zephyx-api:${{ github.sha }} --file artifacts/api-server/Dockerfile .
      - run: docker build --tag zephyx-web:${{ github.sha }} --file artifacts/novamail-web/Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zephyx-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zephyx-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  backup-restore:
    name: Backup and restore verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: zephyx
          POSTGRES_DB: zephyx
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U zephyx -d zephyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Seed and dump isolated database
        env:
          DATABASE_URL: postgresql://zephyx:test-password@127.0.0.1:5432/zephyx
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DATABASE_URL" <<'SQL'
          create table backup_marker (id integer primary key, value text not null);
          insert into backup_marker values (1, 'v6');
          SQL
          bash scripts/backup-postgres.sh
          echo "BACKUP_FILE=$(find "$BACKUP_DIR" -name '*.dump' -print -quit)" >> "$GITHUB_ENV"
      - name: Restore and verify marker
        env:
          DATABASE_URL: postgresql://zephyx:test-password@127.0.0.1:5432/zephyx
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          VERIFY_TABLE: backup_marker
          VERIFY_QUERY: select value from backup_marker where id = 1
        run: |
          bash scripts/verify-backup-restore.sh
